services:
  - type: web
    name: shop-presence-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ADMIN_SECRET_CODE
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # comma-separated extra origins; *.vercel.app / *.pages.dev / *.onrender.com are already allowed
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_PROVIDER
        value: mr_lad
      - key: WHATSAPP_PHONE_NUMBER
        value: "+917780181920"
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1407135925808911"
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        value: "2912980445715643"
      - key: LAD_API_BASE_URL
        value: https://lad-waba-comms-stage-asia-axxjxdzmbq-el.a.run.app
      - key: LAD_AUTH_BASE_URL
        value: https://lad-backend-stage-axxjxdzmbq-uc.a.run.app
      - key: LAD_AUTH_EMAIL
        sync: false
      - key: LAD_AUTH_PASSWORD
        sync: false
      - key: WHATSAPP_DEFAULT_TEMPLATE_NAME
        value: lexon_official_pitch
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_DAILY_SEND_LIMIT
        value: "200"
      - key: WHATSAPP_MAX_BROADCAST_BATCH
        value: "50"
      - key: WHATSAPP_API_VERSION
        value: v22.0
      - key: WHATSAPP_IS_TEST_MODE
        value: "false"
