<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Mobile viewport with safe-area support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Mobile browser chrome color -->
    <meta name="theme-color" content="#2a4ad8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1024" media="(prefers-color-scheme: dark)" />
    <!-- iOS PWA / standalone app settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShopPresence" />
    <!-- Android PWA hint -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Disable automatic phone/email detection on iOS -->
    <meta name="format-detection" content="telephone=no" />
    <title>Website Presence Detection - Nearby Grocery & Business Platform</title>
    <meta name="description" content="Discover nearby grocery stores and shops, evaluate their website presence and quality, and help local businesses grow online." />
    <!-- Google Fonts: Bricolage Grotesque (headings) and Space Grotesk (text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-[Space_Grotesk,sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
